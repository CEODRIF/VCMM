name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (install, typecheck, lint, build, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Frontend tests
        run: npm test

  worker:
    name: Worker (install, syntax, imports, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install FFmpeg/FFprobe (media + rendering integration tests)
        # The worker media/rendering tests (FFprobe validation, audio
        # extraction, real-FFmpeg renderer + processor lifecycles) skip
        # cleanly when no binaries are available — so they must be present
        # here, or they are silently skipped in CI.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Python syntax check
        run: python -m compileall -q app tests

      - name: Python import check
        run: python -c "from app.main import create_app; app = create_app(); print('imports OK:', app.title)"

      - name: Python tests
        run: python -m pytest tests -v

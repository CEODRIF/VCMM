name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (install, typecheck, lint, build, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Frontend tests
        run: npm test

  worker:
    name: Worker (install, syntax, imports, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install FFmpeg/FFprobe (media + rendering integration tests)
        # The worker media/rendering tests (FFprobe validation, audio
        # extraction, real-FFmpeg renderer + processor lifecycles, Phase 5B
        # subtitle burn-in) skip cleanly when no binaries are available —
        # so they must be present here, or they are silently skipped in CI.
        # fonts-dejavu-core pins the deterministic caption font (DejaVu Sans)
        # for the libass integration tests.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python syntax check
        run: python -m compileall -q app benchmarks tests

      - name: Python import check
        run: python -c "from app.main import create_app; app = create_app(); print('imports OK:', app.title)"

      - name: Python tests
        run: python -m pytest tests -v

      - name: Facecam real-model tests (optional extra, best-effort)
        # TASK 008: the facecam real-model smoke tests run ONLY when the
        # optional mediapipe extra and its two small Apache-2.0 model files
        # are available (public Google-hosted assets, downloaded into the
        # workspace — never committed). Best-effort by design: the main
        # worker suite above already ran WITHOUT the extra and skips these
        # tests cleanly, so a failure here (e.g. model host outage) does
        # not fail the PR. No secrets, no paid services, CPU-only.
        continue-on-error: true
        run: |
          pip install -r requirements-facecam.txt
          mkdir -p .facecam-models
          curl -fsSL -o .facecam-models/blaze_face_short_range.tflite \
            "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/latest/blaze_face_short_range.tflite"
          curl -fsSL -o .facecam-models/face_landmarker.task \
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task"
          FACECAM_TEST_MODELS_DIR=.facecam-models python -m pytest tests/test_facecam.py -v -k real_model
